name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.2.0 or 2.0.0)'
        required: true
        default: '1.0.0'

jobs:
  release:
    name: Build & Release Artifacts
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${{ github.ref_name }}"
          fi
          # Strip leading 'v' if present (e.g. v1.2.0 -> 1.2.0)
          CLEAN_VER="${RAW_VER#v}"
          echo "VERSION_NAME=$CLEAN_VER" >> $GITHUB_ENV
          echo "TAG_NAME=v$CLEAN_VER" >> $GITHUB_ENV

      - name: Update app/build.gradle.kts version
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i 's/versionName = .*/versionName = "'"$VERSION_NAME"'"/' app/build.gradle.kts

      - name: Commit & Push Version Bump
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore(release): bump version to $VERSION_NAME (build ${{ github.run_number }})" || echo "No changes to commit"
          git push

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > my-upload-key.jks

      - name: Build Release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease bundleProdRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/prod/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/bundle/prodRelease/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

